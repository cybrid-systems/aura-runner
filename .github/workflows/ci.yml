name: ci

on:
  push:
  pull_request:

jobs:
  aura:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cybrid-systems/aura:e7d85162c
    steps:
      - uses: actions/checkout@v4
      - name: Aura core tests
        run: aura test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Frontend syntax
        run: |
          node --check web/sim.mjs
          node --check web/render.mjs
          node --check web/input.mjs
          node --check web/audio.mjs
          node --check web/main.mjs
          node --check bridge/server.mjs
          node --check scripts/smoke.mjs
          node --check scripts/check-sim.mjs
          node --check scripts/check-lanes.mjs
          node --check scripts/mock-llm-e2e.mjs
      - name: Physics parity with the Aura golden
        run: node scripts/check-sim.mjs
      - name: Left moves toward screen-left
        run: node scripts/check-lanes.mjs

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned Aura
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source scripts/aura-path.sh
          bin="$(install_aura "$RUNNER_TEMP")"
          echo "$(dirname "$bin")" >> "$GITHUB_PATH"
          "$bin" --version
      - name: First install from an empty tools directory
        run: bash scripts/check-install.sh
      - name: Seeded end-to-end run
        run: node scripts/smoke.mjs
      - name: Mock LLM rebind
        run: node scripts/mock-llm-e2e.mjs
