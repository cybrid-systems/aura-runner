name: ci

on:
  push:
  pull_request:

jobs:
  aura:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cybrid-systems/aura-ci@sha256:66392ce2a5f24668fb923d1c900c545435f6b453f3df585dc4668402c07042d5
    steps:
      - uses: actions/checkout@v4
      - name: Orchestra baseline drift (#13)
        run: python3 scripts/check-baseline.py
      - name: Install the pinned Aura nightly
        run: |
          set -euo pipefail
          bin="$(bash scripts/install-aura.sh)"
          echo "$bin" >> "$GITHUB_PATH"
          "$bin/aura" --version
      - name: Aura core tests
        env:
          AURA_SANDBOX: "off"
        run: aura test
      - name: Seeded stretch notes
        env:
          AURA_SANDBOX: "off"
        run: aura --quiet --preset dev scripts/play-review.aura

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Frontend syntax
        run: |
          node --check web/sim.mjs
          node --check web/render.mjs
          node --check web/quality.mjs
          node --check web/lit.mjs
          node --check web/post.mjs
          node --check web/feel.mjs
          node --check web/fallback.mjs
          node --check web/input.mjs
          node --check web/audio.mjs
          node --check web/music.mjs
          node --check web/main.mjs
          node --check web/hearts.mjs
          node --check web/race.mjs
          node --check bridge/server.mjs
          node --check bridge/musiclib.mjs
          node --check scripts/smoke.mjs
          node --check scripts/check-sim.mjs
          node --check scripts/check-lanes.mjs
          node --check scripts/mock-llm-e2e.mjs
          node --check scripts/check-contrast.mjs
          node --check scripts/check-quality.mjs
          node --check scripts/check-edsl.mjs
          node --check scripts/check-edsl-e2e.mjs
          node --check scripts/check-run.mjs
          node --check scripts/shot-biomes.mjs
          node --check scripts/shot-tiers.mjs
          node --check web/runstate.mjs
          node --check scripts/check-setcode.mjs
          node --check scripts/check-play.mjs
          node --check scripts/check-probe.mjs
          node --check scripts/check-music.mjs
          node --check scripts/check-musicdir.mjs
          node --check scripts/check-config.mjs
          node --check scripts/check-voice.mjs
      - name: Physics parity with the Aura golden
        run: node scripts/check-sim.mjs
      - name: Left moves toward screen-left
        run: node scripts/check-lanes.mjs
      - name: Pink garden keeps obstacle contrast
        run: node scripts/check-contrast.mjs
      - name: Quality tiers and sim step
        run: node scripts/check-quality.mjs
      - name: Biome EDSL view gate
        run: node scripts/check-edsl.mjs
      - name: Multiplier, venues, and voice state
        run: node scripts/check-run.mjs
      - name: Startup model probe
        run: node scripts/check-probe.mjs
      - name: Tune bounds, phrase gate, and missing-file bed
        run: node scripts/check-music.mjs
      - name: Settings file, key masking, and music mount
        run: node scripts/check-config.mjs
      - name: Music folder discovery and local playback files
        run: node scripts/check-musicdir.mjs
      - name: Soft voice stays on one pitch
        run: node scripts/check-voice.mjs

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Aura nightly
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source scripts/aura-path.sh
          bin="$(install_aura "$RUNNER_TEMP")"
          echo "$(dirname "$bin")" >> "$GITHUB_PATH"
          "$bin" --version
      - name: Sandbox stays on for play
        run: bash scripts/check-sandbox.sh
      - name: Evolution report stays local
        run: bash scripts/evo-report.sh
      - name: First install from an empty cache
        run: bash scripts/check-install.sh
      - name: No-compile ./run.sh
        run: bash scripts/check-runsh.sh
      - name: Seeded end-to-end run
        run: node scripts/smoke.mjs
      - name: Mock LLM rebind
        run: node scripts/mock-llm-e2e.mjs
      - name: Biome EDSL gate and voice switch
        run: node scripts/check-edsl-e2e.mjs
      - name: Rebind refusal falls back to set-code
        run: node scripts/check-setcode.mjs
      - name: Ten minute run with a hung model call
        run: node scripts/check-play.mjs
