<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f0b06a" />
  <title>Lumen Run</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="view" tabindex="0"></canvas>
  <p id="nogpu" hidden>This browser needs WebGL2 to draw the garden.</p>
  <p id="toast" hidden aria-live="polite"></p>
  <div id="flash" hidden></div>
  <p id="kicker">points</p>
  <div id="score" aria-hidden="true">0</div>
  <p id="grade" aria-hidden="true">Sprout ★☆☆☆☆</p>
  <div id="meter" aria-hidden="true"><span id="meter-fill"></span></div>
  <p id="pace" aria-hidden="true">Level 1 · Speed 8</p>
  <div id="goal" aria-hidden="true"><span id="goal-fill"></span></div>
  <p id="ward" aria-hidden="true">Shield</p>
  <p id="record" hidden aria-hidden="true"></p>
  <p id="combo" hidden aria-hidden="true"></p>
  <p id="gain" hidden aria-hidden="true"></p>
  <button id="wish-open" type="button" aria-expanded="false" aria-controls="wish">wish</button>
  <div id="wish" hidden>
    <p class="notes-title">Wish</p>
    <div class="wish-lang">
      <button id="wish-zh" type="button" aria-pressed="true">中文</button>
      <button id="wish-en" type="button" aria-pressed="false">EN</button>
    </div>
    <p id="wish-live" aria-live="polite"></p>
    <div id="wish-presets"></div>
    <input id="wish-text" type="text" maxlength="80" autocomplete="off" enterkeyhint="send" />
    <button id="wish-send" type="button">就用这句</button>
    <button id="wish-mic" type="button" hidden aria-pressed="false">按住说</button>
    <p id="wish-consent" hidden>声音会交给浏览器的听写，不会存进本游戏</p>
    <button id="wish-allow" type="button" hidden>可以听</button>
    <div id="wish-confirm" hidden>
      <p id="wish-final"></p>
      <button id="wish-use" type="button">就用这句</button>
      <button id="wish-again" type="button">再试一次</button>
      <button id="wish-type" type="button">改成打字</button>
    </div>
    <button id="wish-talk" type="button" hidden aria-pressed="false">读出来</button>
  </div>
  <button id="cards-open" type="button" aria-expanded="false" aria-controls="deck">cards</button>
  <div id="deck" hidden>
    <p class="notes-title">Cards</p>
    <div id="card-book"></div>
    <div id="primer" hidden>
      <p id="primer-note">先改规则、路还在跑</p>
      <textarea id="primer-text" rows="2" maxlength="80" spellcheck="false" autocomplete="off" aria-label="规则"></textarea>
      <button id="primer-try" type="button">试一下</button>
    </div>
    <p id="card-share" hidden></p>
    <button id="cards-use" type="button">用这几张</button>
    <button id="cards-share" type="button">分享</button>
  </div>
  <button id="badge" type="button" aria-expanded="false" aria-controls="notes">
    <span class="badge-kicker">world</span>
    <span id="replay">LUMEN</span>
  </button>
  <div id="notes" hidden>
    <p class="notes-title">World</p>
    <ol id="note-list"></ol>
  </div>
  <button id="motion" type="button" aria-label="Reduce motion" aria-pressed="false">◎</button>
  <button id="mute" type="button" aria-label="Mute" aria-pressed="false">♪</button>
  <p id="said" hidden aria-live="polite"></p>
  <p id="mark" hidden></p>
  <button id="again" type="button" aria-keyshortcuts="R">Restart</button>
  <button id="model" type="button" hidden>DeepSeek</button>
  <p id="stats" hidden></p>
  <pre id="bench" hidden></pre>
  <script type="module" src="main.mjs"></script>
</body>
</html>
