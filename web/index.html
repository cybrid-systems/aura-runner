<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Lumen Run</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="view"></canvas>
  <p id="nogpu" hidden>This browser needs WebGL2 to draw the course.</p>
  <div id="score" aria-hidden="true">0</div>
  <div id="replay" aria-label="Share code"></div>
  <button id="motion" type="button" aria-label="Reduce motion" aria-pressed="false">◎</button>
  <button id="mute" type="button" aria-label="Mute" aria-pressed="false">♪</button>
  <button id="dead" type="button" hidden aria-label="Play again">
    <span class="arrow" aria-hidden="true"></span>
  </button>
  <p id="stats" hidden></p>
  <pre id="bench" hidden></pre>
  <script type="module" src="main.mjs"></script>
</body>
</html>
